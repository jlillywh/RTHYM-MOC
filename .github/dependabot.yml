# Dependabot version updates for Python dependencies and GitHub Actions.
# Vulnerability alerts are enabled separately in repository security settings.

version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      dev-dependencies:
        patterns:
          - pytest*
          - ruff
          - mypy
          - pre-commit
          - matplotlib
          - sphinx*
          - numpydoc
      runtime-and-optional:
        patterns:
          - numpy
          - wntr
          - tsnet
          - ptsnet
          - mpi4py
          - h5py
          - tqdm
          - numba
          - pybind11
          - scikit-build-core
    ignore:
      # wntr still imports pkg_resources (removed in setuptools>=82) and Python 3.9 requires <84
      - dependency-name: setuptools
        versions:
          - ">= 82.0.0"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - "*"
